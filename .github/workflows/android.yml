name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Versão (sempre crescente)
        id: ver
        run: |
          # versionCode = minutos desde 2024-01-01 -> cada build é maior que a anterior,
          # então o Android aceita instalar por cima sem desinstalar.
          CODE=$(( ( $(date -u +%s) - 1704067200 ) / 60 ))
          NAME="$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Chave de assinatura (secret opcional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Usando keystore dos secrets"
          else
            echo "Usando keystore/inventario.jks do repositório"
          fi

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Renomear APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Inventario-${VERSION_NAME}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Inventario-${{ steps.ver.outputs.name }}
          path: out/*.apk

      # Publica uma Release (link fácil de baixar no celular) em push na branch padrão,
      # em tags v* ou ao rodar manualmente.
      - name: Release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Inventário ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          make_latest: true
