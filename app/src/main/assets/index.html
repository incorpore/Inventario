<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Inventário</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --card2:#f0f2f7; --text:#0f172a; --text2:#475569; --muted:#8a94a6; --line:#e6e9f0;
  --primary:#4f46e5; --primary-2:#7c3aed; --primary-soft:#eef0ff; --on-primary:#fff;
  --danger:#dc2626; --warn:#b45309; --ok:#15803d;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --r:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.05);
  --shadow-lg:0 10px 30px rgba(79,70,229,.25);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d12; --card:#151821; --card2:#1c202b; --text:#e8eaf0; --text2:#b4bccb; --muted:#7d8699; --line:#252a37;
    --primary:#818cf8; --primary-2:#a78bfa; --primary-soft:#1f2240; --on-primary:#0b0d12;
    --danger:#f87171; --warn:#fbbf24; --ok:#4ade80;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 10px 30px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d12; --card:#151821; --card2:#1c202b; --text:#e8eaf0; --text2:#b4bccb; --muted:#7d8699; --line:#252a37;
  --primary:#818cf8; --primary-2:#a78bfa; --primary-soft:#1f2240; --on-primary:#0b0d12;
  --danger:#f87171; --warn:#fbbf24; --ok:#4ade80;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 10px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:120px;overflow-x:hidden}
button{font:inherit;color:inherit}
.i{width:20px;height:20px;flex:none;display:block}
.i.sm{width:16px;height:16px}.i.lg{width:24px;height:24px}

/* header */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 16px 10px}
.hrow{display:flex;align-items:center;gap:10px;min-height:40px}
.hrow h1{flex:1;min-width:0;font-size:22px;font-weight:750;letter-spacing:-.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{color:var(--muted);font-size:13px;margin-top:2px}
.iconbtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--text)}
.iconbtn.ghost{border:0;background:transparent;margin-left:-8px}
.iconbtn:active{transform:scale(.95)}
main{padding:2px 16px 16px;max-width:760px;margin:0 auto}

/* inputs */
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
input:disabled{opacity:.7}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin:12px 0 5px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.searchbox{position:relative;margin:4px 0 10px}
.searchbox .i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox input{padding-left:42px;border-radius:14px;height:48px;box-shadow:var(--shadow);border-color:transparent}
.searchbox input:focus{border-color:var(--primary)}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text2);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}

/* cards & lists */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:10px 0;overflow:hidden}
.pad{padding:14px 16px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;position:relative}
.li+.li::before{content:"";position:absolute;top:0;left:64px;right:0;border-top:1px solid var(--line)}
.li:active{background:var(--card2)}
.li .main{flex:1;min-width:0}
.li .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .q{flex:none;text-align:right;font-weight:750;font-variant-numeric:tabular-nums}
.li .q small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.li .chev{color:var(--muted)}
.tile{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.tile.big{width:52px;height:52px;border-radius:16px}.tile.big .i{width:26px;height:26px}
.t1{background:color-mix(in srgb,var(--s1) 14%,transparent);color:var(--s1)}
.t2{background:color-mix(in srgb,var(--s2) 14%,transparent);color:var(--s2)}
.t3{background:color-mix(in srgb,var(--s3) 14%,transparent);color:var(--s3)}
.t4{background:color-mix(in srgb,var(--s4) 16%,transparent);color:var(--s4)}
.t5{background:color-mix(in srgb,var(--s5) 16%,transparent);color:var(--s5)}
.t6{background:color-mix(in srgb,var(--s6) 14%,transparent);color:var(--s6)}
.t7{background:color-mix(in srgb,var(--s7) 14%,transparent);color:var(--s7)}
.t8{background:color-mix(in srgb,var(--s8) 14%,transparent);color:var(--s8)}
.tile.chk{background:var(--card2);border:2px solid var(--line);color:transparent}
.li.sel .tile.chk{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:650;padding:1px 8px;border-radius:999px;background:var(--card2);color:var(--text2);margin-left:6px;vertical-align:1px}
.badge.danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.badge.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.sec{font-size:13px;font-weight:700;color:var(--text2);margin:20px 4px 2px;display:flex;justify-content:space-between;align-items:center}
.sec a{color:var(--primary);font-weight:600;cursor:pointer;text-decoration:none}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .tile{margin:0 auto 12px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.crumb a{color:var(--primary);text-decoration:none;cursor:pointer;font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:var(--r-sm);padding:12px 16px;font-weight:650;background:var(--primary);color:var(--on-primary);cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.text-danger{color:var(--danger)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;border-radius:16px;padding:14px 4px 12px;background:var(--card);box-shadow:var(--shadow);font-size:12.5px;font-weight:650;cursor:pointer;color:var(--text)}
.act .tile{width:38px;height:38px}
.act:active{transform:scale(.97)}
.fab{position:fixed;right:18px;bottom:96px;height:56px;min-width:56px;padding:0 18px;border-radius:18px;border:0;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:var(--shadow-lg);cursor:pointer;z-index:6;display:flex;align-items:center;gap:8px;font-weight:700}
.fab .i{width:24px;height:24px}
.fab[hidden]{display:none}

/* nav */
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 28px rgba(15,23,42,.12);z-index:7;padding:6px;max-width:740px;margin:0 auto}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:6px 0 5px;font-size:11px;font-weight:650;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:16px}
nav button .pill{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .2s}
nav button.on{color:var(--primary)}
nav button.on .pill{background:var(--primary-soft)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet .handle{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 2px;font-size:19px;letter-spacing:-.01em}
.sheet .foot{display:flex;gap:10px;margin-top:18px;position:sticky;bottom:-22px;background:var(--bg);padding:10px 0 0}.sheet .foot .btn{flex:1}
@keyframes up{from{transform:translateY(60px);opacity:.4}}@keyframes fade{from{opacity:0}}
.toast{pointer-events:none;position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;z-index:30;font-size:14px;font-weight:600;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s}
.radio{display:flex;gap:8px}
.radio label{flex:1;margin:0;border:1.5px solid var(--line);background:var(--card);color:var(--text);padding:11px 8px;border-radius:var(--r-sm);text-align:center;font-size:13.5px;font-weight:600;cursor:pointer}
.radio input{display:none}
.radio label:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.radio label:has(input:disabled){opacity:.45}
.checks label{display:flex;gap:10px;align-items:center;color:var(--text);margin:10px 0;font-size:14px;font-weight:500}
.checks input{width:20px;height:20px;accent-color:var(--primary);flex:none}
.selbar{position:fixed;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:8;background:var(--text);color:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-radius:16px;max-width:740px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.selbar b{flex:1}.selbar .btn{padding:8px 12px;font-size:13px}
.selbar .btn.ghost{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}

/* item detail */
.hero{border-radius:22px;padding:18px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:var(--shadow-lg);margin:6px 0 12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .lbl{font-size:13px;opacity:.85;font-weight:600}
.hero .val{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.hero .val small{font-size:16px;font-weight:600;opacity:.85}
.hero .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;opacity:.92}
.hero .meta b{font-weight:750}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;padding:14px 16px}
.kv div:nth-child(odd){color:var(--muted);font-size:13.5px}
.kv div:nth-child(even){font-weight:550}

/* dashboard */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.stat .n{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .top{display:flex;justify-content:space-between;align-items:flex-start}
.stat .tile{width:34px;height:34px;border-radius:10px}.stat .tile .i{width:18px;height:18px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.quick button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer}
.quick .tile{width:52px;height:52px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);color:var(--primary)}
.chart{padding:16px}
.chart h3{margin:0;font-size:15px;font-weight:700}
.chart .csub{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.chart .chead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;flex:none}
.seg button{border:0;background:none;font-size:12px;font-weight:650;padding:5px 10px;border-radius:8px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.hb{padding:5px 0;cursor:pointer}
.hb-l{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px}
.hb-l span{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-l b{font-variant-numeric:tabular-nums;font-weight:700;flex:none}
.hb-t{height:10px;background:var(--card2);border-radius:5px;overflow:hidden}
.hb-b{height:100%;border-radius:0 4px 4px 0;background:var(--s1);min-width:3px}
.stack{display:flex;gap:2px;height:16px;border-radius:5px;overflow:hidden}
.stack div{min-width:3px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--text);font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid var(--line);padding-top:6px;position:relative}
.cols .day{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;cursor:pointer}
.cols .bar{width:42%;max-width:9px;border-radius:4px 4px 0 0;min-height:0}
.cols .grid{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:10.5px;color:var(--muted)}
.cols .grid span{position:absolute;top:-15px;left:0;background:var(--card);padding-right:4px}
.xlab{display:flex;gap:4px;font-size:10.5px;color:var(--muted);margin-top:5px}
.xlab span{flex:1;text-align:center;white-space:nowrap}
.tip{position:fixed;z-index:40;background:var(--text);color:var(--bg);font-size:12.5px;font-weight:600;padding:7px 10px;border-radius:9px;pointer-events:none;max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.onb{text-align:center;padding:28px 18px}
.onb h2{margin:10px 0 4px;font-size:20px}
.onb p{color:var(--muted);margin:0 0 16px}
.onb .btn{width:100%;margin-top:8px}
details.card summary{list-style:none;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
details[open] .chev{transform:rotate(90deg)}
.map{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;background:var(--card)}
.map .t{font-weight:650}.map select{margin-top:6px}
.prev{font-size:13px;color:var(--text2);margin:6px 0 0;padding-left:18px}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<button class="fab" id="fab" hidden></button>
<nav id="nav"></nav>

<script>
"use strict";
/* ====================== Persistência ====================== */
const N = window.Android || null;
const DB_FILE = "db.json", CFG_FILE = "cfg.json";
function rawRead(name){ try{ return N ? N.read(name) : localStorage.getItem("inv_"+name); }catch(e){ return null; } }
function rawWrite(name, s){ try{ return N ? N.write(name, s) : (localStorage.setItem("inv_"+name, s), true); }catch(e){ return false; } }

function emptyDB(){ return {schema:1, storages:[], items:[], loans:[], moves:[], meta:{createdAt:Date.now(), updatedAt:Date.now()}}; }
function normalizeDB(d){
  const e = emptyDB();
  if(!d || typeof d!=="object") return e;
  for(const k of ["storages","items","loans","moves"]) e[k] = Array.isArray(d[k]) ? d[k] : [];
  e.meta = Object.assign(e.meta, d.meta||{});
  return e;
}
let db = normalizeDB(JSON.parse(rawRead(DB_FILE) || "null"));
let cfg = Object.assign({s3:{endpoint:"",region:"us-east-1",bucket:"",prefix:"inventario/",accessKey:"",secretKey:"",auto:false}, lastBackup:0, dirty:false}, JSON.parse(rawRead(CFG_FILE) || "{}"));

function save(){
  db.meta.updatedAt = Date.now();
  if(!rawWrite(DB_FILE, JSON.stringify(db))) toast("⚠️ Falha ao salvar!");
  cfg.dirty = true; saveCfg();
}
function saveCfg(){ rawWrite(CFG_FILE, JSON.stringify(cfg)); }

let cbSeq = 0; const cbs = {};
window.__nativeCb = (id, ok, data) => { const c = cbs[id]; if(!c) return; delete cbs[id]; ok ? c.res(data) : c.rej(new Error(data)); };
function nativeCall(fn, ...args){ return new Promise((res, rej) => { const id = ++cbSeq; cbs[id] = {res, rej}; N[fn](id, ...args); }); }

/* ====================== Utilidades ====================== */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const num = v => { if(typeof v==="number") return isFinite(v) ? Math.round(v*1000)/1000 : 0; let t = String(v ?? "").trim().replace(/[R$\s]/g, ""); if(t.includes(",")) t = t.replace(/\./g, "").replace(",", "."); const n = parseFloat(t); return isFinite(n) ? Math.round(n*1000)/1000 : 0; };
const fq = n => (Math.round((n||0)*1000)/1000).toLocaleString("pt-BR");
const money = n => (n||0).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const moneyShort = n => n>=1e6 ? "R$ "+(n/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi" : n>=1e4 ? "R$ "+(n/1e3).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil" : money(n);
const fdate = t => new Date(t).toLocaleString("pt-BR", {day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});
const fday = t => new Date(t).toLocaleDateString("pt-BR", {day:"2-digit",month:"2-digit"});
function toast(msg){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t = document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }

/* ícones (traço, estilo Lucide) */
const IC = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke-width="3"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  more:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',

const icon = (n, cls="") => `<svg class="i ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||IC.folder}</svg>`;

const TYPES = {"Cômodo":{i:"home",c:1},"Armário":{i:"cabinet",c:7},"Prateleira":{i:"shelf",c:3},"Caixa":{i:"box",c:2},"Balde":{i:"bucket",c:4},"Gaveta":{i:"drawer",c:5},"Sacola":{i:"bag",c:6},"Mala":{i:"suitcase",c:8},"Veículo":{i:"car",c:1},"Outro":{i:"folder",c:3}};
const T = type => TYPES[type] || TYPES.Outro;
const tile = (type, big) => `<div class="tile t${T(type).c} ${big?"big":""}">${icon(T(type).i)}</div>`;
const CONDS = ["Novo","Bom","Usado","Desgastado","Danificado","Para conserto"];
const UNITS = ["un","pç","par","cx","pct","rolo","kg","g","L","mL","m","cm","m²"];
const condClass = c => ({"Novo":"ok","Bom":"ok","Danificado":"danger","Para conserto":"danger","Desgastado":"warn"}[c] || "");

const S = id => db.storages.find(s => s.id === id);
const I = id => db.items.find(i => i.id === id);
function path(id){ const out=[]; let s=S(id), g=0; while(s && g++<50){ out.unshift(s.name); s=S(s.parentId); } return out.join(" › ") || "—"; }
function descendants(id){ const ids=[id]; for(let i=0;i<ids.length;i++) db.storages.forEach(s=>{ if(s.parentId===ids[i]) ids.push(s.id); }); return ids; }
function rootOf(id){ let s=S(id), g=0; while(s && S(s.parentId) && g++<50) s=S(s.parentId); return s; }
function storageOptions(sel, excludeTree){
  const ex = excludeTree ? descendants(excludeTree) : [];
  return db.storages.filter(s=>!ex.includes(s.id)).map(s=>({id:s.id,p:path(s.id)})).sort((a,b)=>a.p.localeCompare(b.p,"pt-BR"))
    .map(o=>`<option value="${o.id}" ${o.id===sel?"selected":""}>${esc(o.p)}</option>`).join("");
}
const openLoans = itemId => db.loans.filter(l => l.qty - l.returned > 0 && (!itemId || l.itemId === itemId));
const loanedQty = itemId => openLoans(itemId).reduce((a,l)=>a + l.qty - l.returned, 0);
const itemTotal = i => (i.value||0) * ((i.qty||0) + loanedQty(i.id));
const isLow = i => i.minQty>0 && i.qty < i.minQty;

function logMove(type, item, qty, extra={}){
  db.moves.unshift(Object.assign({id:uid(), date:Date.now(), type, itemId:item.id, itemName:item.name, unit:item.unit, qty}, extra));
  if(db.moves.length > 5000) db.moves.length = 5000;
}
function findTwin(item, storageId){
  return db.items.find(i => i.id!==item.id && i.storageId===storageId && norm(i.name)===norm(item.name) && (i.unit||"")===(item.unit||"") && (i.condition||"")===(item.condition||""));
}

/* tooltip dos gráficos */
const tipEl = document.createElement("div"); tipEl.className = "tip";
function showTip(t){
  tipEl.textContent = t.dataset.tip; document.body.appendChild(tipEl);
  const r = t.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(8, Math.min(innerWidth-w-8, r.left + r.width/2 - w/2)) + "px";
  tipEl.style.top = Math.max(8, r.top - h - 8) + "px";
}
function hideTip(){ tipEl.remove(); }
document.addEventListener("pointerover", e => { if(e.pointerType!=="mouse") return; const t = e.target.closest("[data-tip]"); t ? showTip(t) : hideTip(); });
document.addEventListener("pointerdown", e => { const t = e.target.closest("[data-tip]"); t ? showTip(t) : hideTip(); });
addEventListener("scroll", hideTip, {passive:true});

/* ====================== Navegação ====================== */
const TABS = [["home","Início","home"],["items","Itens","list"],["storages","Armazéns","box"],["history","Histórico","clock"],["more","Mais","more"]];
$("#nav").innerHTML = TABS.map(([k,l,i])=>`<button data-tab="${k}"><span class="pill">${icon(i)}</span>${l}</button>`).join("");
let tab = "home", stack = [];
const ui = {q:"", filter:"all", hist:"all", selMode:false, sel:new Set(), chart:"value"};
function go(view, push=true){ if(push) stack.push(view); render(); window.scrollTo(0,0); }
function cur(){ return stack[stack.length-1] || {v:tab}; }
function setTab(t){ tab=t; stack=[]; render(); window.scrollTo(0,0); }
function openItems(filter, q=""){ ui.filter = filter; ui.q = q; setTab("items"); }
document.querySelectorAll("nav button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
window.onBack = () => {
  if(document.querySelector(".sheet-bg")){ closeSheet(); return true; }
  if(ui.selMode && tab==="items" && !stack.length){ selExit(); return true; }
  if(stack.length){ stack.pop(); render(); return true; }
  if(tab!=="home"){ setTab("home"); return true; }
  return false;
};

function header(title, sub, back, actions=""){
  $("#hdr").innerHTML = `<div class="hrow">${back?`<button class="iconbtn ghost" onclick="onBack()" aria-label="Voltar">${icon("back","lg")}</button>`:""}<h1>${title}</h1>${actions}</div>${sub?`<div class="sub">${sub}</div>`:""}`;
}
const hbtn = (ic, fn, label) => `<button class="iconbtn" onclick="${fn}" aria-label="${label}" title="${label}">${icon(ic)}</button>`;
function fab(fn, label=""){ const f=$("#fab"); f.hidden=!fn; f.onclick=fn||null; f.innerHTML = icon("plus") + (label?`<span>${label}</span>`:""); }

function render(){
  hideTip();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab===tab));
  const c = cur();
  const views = {home:vHome, items:vItems, storages:vStorages, history:vHistory, more:vMore, storage:vStorage, item:vItem};
  (views[c.v] || vHome)(c);
  selBar();
}
function selBar(){
  let b = $("#selbar");
  const show = ui.selMode && tab==="items" && !stack.length;
  if(!show){ if(b) b.remove(); return; }
  if(!b){ b = document.createElement("div"); b.id="selbar"; b.className="selbar"; document.body.appendChild(b); }
  b.innerHTML = `<b>${ui.sel.size} selecionado(s)</b>
    <button class="btn ghost" onclick="selAll()">Todos</button>
    <button class="btn" onclick="printForm({scope:'sel'})" ${ui.sel.size?"":"disabled"}>${icon("printer","sm")} PDF</button>
    <button class="btn ghost" onclick="selExit()" aria-label="Sair">${icon("x","sm")}</button>`;
}
function rowTap(id){
  if(ui.selMode && tab==="items" && !stack.length){ ui.sel.has(id) ? ui.sel.delete(id) : ui.sel.add(id); listItems(); selBar(); }
  else go({v:'item',id});
}
function selStart(){ ui.selMode = true; render(); }
function selExit(){ ui.selMode = false; ui.sel.clear(); render(); }
function selAll(){ const l = filteredItems(); const all = l.every(i=>ui.sel.has(i.id)); l.forEach(i=> all ? ui.sel.delete(i.id) : ui.sel.add(i.id)); listItems(); selBar(); }

/* ====================== Linhas ====================== */
function itemRow(i, showPath=true){
  const lq = loanedQty(i.id), low = isLow(i);
  const st = S(i.storageId);
  const sm = ui.selMode && tab==="items" && !stack.length, on = sm && ui.sel.has(i.id);
  return `<div class="li ${on?"sel":""}" onclick="rowTap('${i.id}')">
    ${sm?`<div class="tile chk">${icon("check")}</div>`:tile(st&&st.type)}
    <div class="main"><div class="t">${esc(i.name)}${i.condition?`<span class="badge ${condClass(i.condition)}">${esc(i.condition)}</span>`:""}</div>
    <div class="s">${showPath?esc(path(i.storageId)):esc(i.category||i.notes||"")}${i.value?" · "+money(i.value):""}</div></div>
    <div class="q" style="${low||i.qty===0?"color:var(--danger)":""}">${fq(i.qty)} <span style="font-weight:600">${esc(i.unit)}</span>${lq?`<small>+${fq(lq)} fora</small>`:low?`<small>mín ${fq(i.minQty)}</small>`:""}</div></div>`;
}
function storageRow(s){
  const ids = descendants(s.id);
  const its = db.items.filter(i=>ids.includes(i.storageId));
  const val = its.reduce((a,i)=>a+itemTotal(i),0);
  const subs = db.storages.filter(x=>x.parentId===s.id).length;
  return `<div class="li" onclick="go({v:'storage',id:'${s.id}'})">
    ${tile(s.type)}
    <div class="main"><div class="t">${esc(s.name)}</div><div class="s">${esc(s.type)}${s.location?" · "+esc(s.location):""}${subs?` · ${subs} dentro`:""}</div></div>
    <div class="q">${its.length}<small>${val?moneyShort(val):"itens"}</small></div></div>`;
}
function loanRow(l){
  const rem = l.qty - l.returned;
  const days = Math.floor((Date.now()-l.date)/864e5);
  return `<div class="li" onclick="returnForm('${l.id}')"><div class="tile t2">${icon("user")}</div>
    <div class="main"><div class="t">${esc(l.itemName)}</div><div class="s">${l.who?esc(l.who)+" · ":""}${days?`há ${days} dia${days>1?"s":""}`:"hoje"}${l.note?" · "+esc(l.note):""}</div></div>
    <div class="q">${fq(rem)} ${esc(l.unit)}<small style="color:var(--primary);font-weight:650">Devolver</small></div></div>`;
}
const MV = {criado:["plus","Cadastro",3],entrada:["in","Entrada",3],retirada:["out","Baixa",8],emprestimo:["user","Retirada (volta)",2],devolucao:["undo","Devolução",1],transferencia:["swap","Transferência",7],ajuste:["edit","Ajuste",4],exclusao:["trash","Exclusão",8],importacao:["json","Importação",1]};
function moveRow(m, showName=true){
  const [ic, label, c] = MV[m.type] || ["info", m.type, 3];
  const sign = ["entrada","devolucao","criado","importacao"].includes(m.type) ? "+" : ["retirada","emprestimo","exclusao"].includes(m.type) ? "−" : "";
  const where = m.type==="transferencia" ? `${esc(m.from)} → ${esc(m.to)}` : esc(m.where||"");
  return `<div class="li" ${I(m.itemId)?`onclick="go({v:'item',id:'${m.itemId}'})"`:""}><div class="tile t${c}">${icon(ic)}</div>
    <div class="main"><div class="t">${showName?esc(m.itemName):label}</div>
    <div class="s">${showName?label+" · ":""}${fdate(m.date)}${m.who?" · "+esc(m.who):""}${where?" · "+where:""}${m.note?" · "+esc(m.note):""}</div></div>
    <div class="q">${sign}${fq(m.qty)} <small>${esc(m.unit)}</small></div></div>`;
}

/* ====================== Gráficos (HTML/CSS) ====================== */
function hbars(rows, fmt, slot=1){
  const max = Math.max(...rows.map(r=>r.v), 0) || 1;
  return rows.map(r=>`<div class="hb" ${r.on?`onclick="${r.on}"`:""} data-tip="${esc(r.label)}: ${esc(fmt(r.v))}${r.extra?" · "+esc(r.extra):""}">
    <div class="hb-l"><span>${esc(r.label)}</span><b>${esc(fmt(r.v))}</b></div>
    <div class="hb-t"><div class="hb-b" style="width:${Math.max(1.5, r.v/max*100)}%;background:var(--s${slot})"></div></div></div>`).join("");
}
function topN(map, n){
  const arr = Object.entries(map).map(([label,v])=>({label, v})).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  if(arr.length<=n) return arr;
  const rest = arr.slice(n-1).reduce((a,r)=>a+r.v,0);
  return [...arr.slice(0,n-1), {label:"Outros", v:rest}];
}

/* ====================== Telas ====================== */
function vHome(){
  const nItems = db.items.length, total = db.items.reduce((a,i)=>a+itemTotal(i),0);
  const units = db.items.reduce((a,i)=>a+(i.qty||0),0);

  const amax = Math.max(1, ...act.map(a=>Math.max(a.inn,a.out)));
  const recent = db.items.slice().sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0)).slice(0,5);

  $("#app").innerHTML = `

    </div>
    <div class="quick">

    <div class="stats" style="margin-top:12px">
      <div class="stat" onclick="openItems('out')"><div class="top"><div class="n">${loans.length}</div><div class="tile t2">${icon("user")}</div></div><div class="l">A devolver</div></div>
      <div class="stat" onclick="openItems('low')"><div class="top"><div class="n" style="${low.length?"color:var(--danger)":""}">${low.length}</div><div class="tile t8">${icon("alert")}</div></div><div class="l">Estoque baixo</div></div>
      <div class="stat" onclick="openItems('zero')"><div class="top"><div class="n">${zero.length}</div><div class="tile t4">${icon("box")}</div></div><div class="l">Zerados</div></div>
      <div class="stat" onclick="setTab('history')"><div class="top"><div class="n">${act.reduce((a,x)=>a+x.inn+x.out,0)}</div><div class="tile t3">${icon("trend")}</div></div><div class="l">Movimentações (14 dias)</div></div>
    </div>

    ${nItems?`<div class="card chart">
      <div class="chead"><div><h3>Por categoria</h3><div class="csub">${ui.chart==="value"?"Valor total em cada categoria":"Quantidade de itens cadastrados"}</div></div>

      ${hbars(stRows, v=>v+" "+(v>1?"itens":"item"), 7)}

    <div class="card chart">

function filteredItems(){
  const terms = norm(ui.q).split(/\s+/).filter(Boolean);
  return db.items.filter(i => {
    const f = ui.filter;
    if(f==="out" && !loanedQty(i.id)) return false;
    if(f==="low" && !isLow(i)) return false;
    if(f==="zero" && i.qty!==0) return false;
    if(f.startsWith("c:") && i.condition!==f.slice(2)) return false;
    if(!terms.length) return true;
    const hay = norm([i.name,i.category,i.notes,i.condition,i.unit,path(i.storageId),...openLoans(i.id).map(l=>l.who)].join(" "));
    return terms.every(t => hay.includes(t));
  }).sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));
}

let sheetEl = null;
function openSheet(title, body, onSubmit, submitLabel="Salvar"){
  closeSheet();
  sheetEl = document.createElement("div"); sheetEl.className = "sheet-bg";
  sheetEl.innerHTML = `<form class="sheet" autocomplete="off"><div class="handle"></div><h2>${title}</h2>${body}
    <div class="foot"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn" type="submit">${submitLabel}</button></div></form>`;
  sheetEl.onclick = e => { if(e.target===sheetEl || e.target.closest("[data-close]")) closeSheet(); };
  const form = sheetEl.querySelector("form");
  form.onsubmit = e => { e.preventDefault(); const d = Object.fromEntries(new FormData(form)); if(onSubmit(d, form) !== false){ closeSheet(); render(); } };
  document.body.appendChild(sheetEl);
  const first = form.querySelector("[autofocus]"); if(first) setTimeout(()=>first.focus(), 80);
  return form;
}
function closeSheet(){ if(sheetEl){ sheetEl.remove(); sheetEl=null; } }

function storageForm(id, parentId){
  const s = id ? S(id) : {name:"", type:"Caixa", parentId:parentId||"", location:"", notes:""};
  openSheet(id?"Editar armazém":"Novo armazém", `
    <label>Nome *</label><input name="name" required value="${esc(s.name)}" placeholder="Ex.: Caixa de ferramentas" ${id?"":"autofocus"}>
    <label>Tipo</label><select name="type">${Object.keys(TYPES).map(t=>`<option ${t===s.type?"selected":""}>${t}</option>`).join("")}</select>
    <label>Dentro de (opcional)</label><select name="parentId"><option value="">— nenhum (armazém principal) —</option>${storageOptions(s.parentId, id)}</select>
    <label>Localização / referência</label><input name="location" value="${esc(s.location)}" placeholder="Ex.: garagem, prateleira de cima">
    <label>Observação</label><textarea name="notes">${esc(s.notes)}</textarea>`, d => {
    if(!d.name.trim()) return false;
    if(id){ Object.assign(s, {name:d.name.trim(), type:d.type, parentId:d.parentId||"", location:d.location.trim(), notes:d.notes.trim()}); }
    else { const n = {id:uid(), name:d.name.trim(), type:d.type, parentId:d.parentId||"", location:d.location.trim(), notes:d.notes.trim(), createdAt:Date.now()}; db.storages.push(n); save(); toast("Armazém criado"); if(tab==="storages" && !stack.length) stack.push({v:"storage",id:n.id}); return; }
    save(); toast("Salvo");
  });
}
function deleteStorage(id){
  const s = S(id), subs = db.storages.filter(x=>x.parentId===id), items = db.items.filter(i=>i.storageId===id);
  if(subs.length || items.length){
    const parent = S(s.parentId);
    if(!parent){ alert(`"${s.name}" não está vazio (${items.length} itens, ${subs.length} armazéns dentro). Transfira ou exclua o conteúdo primeiro.`); return; }
    if(!confirm(`"${s.name}" não está vazio. Mover o conteúdo para "${parent.name}" e excluir?`)) return;
    subs.forEach(x=>x.parentId=parent.id);
    items.forEach(i=>{ logMove("transferencia", i, i.qty, {from:path(id), to:path(parent.id), note:"armazém excluído"}); i.storageId=parent.id; });
  } else if(!confirm(`Excluir "${s.name}"?`)) return;
  db.storages = db.storages.filter(x=>x.id!==id);
  save(); toast("Armazém excluído"); stack.pop(); render();
}

function itemForm(id, storageId, copyFrom){
  if(!db.storages.length){ toast("Crie um armazém primeiro"); return storageForm(); }
  const base = id ? I(id) : copyFrom ? Object.assign({}, I(copyFrom), {qty:1}) : {name:"", qty:1, unit:"un", condition:"Bom", category:"", notes:"", minQty:0, storageId: storageId || (cur().v==="storage"?cur().id:"") || (S(ui.lastSt)?ui.lastSt:"")};
  const cats = [...new Set(db.items.map(i=>i.category).filter(Boolean))].sort();
  openSheet(id?"Editar item":"Novo item", `
    <label>Nome *</label><input name="name" required value="${esc(base.name)}" placeholder="Ex.: Furadeira" ${id?"":"autofocus"}>
    <div class="row"><div><label>Quantidade</label><input name="qty" inputmode="decimal" value="${fq(base.qty)}"></div>
    <div><label>Unidade</label><input name="unit" list="units" value="${esc(base.unit)}"></div></div>
    <datalist id="units">${UNITS.map(u=>`<option value="${u}">`).join("")}</datalist>
    <label>Armazém *</label><select name="storageId" required>${storageOptions(base.storageId)}</select>
    <div class="row"><div><label>Estado</label><select name="condition"><option value="">—</option>${CONDS.map(c=>`<option ${c===base.condition?"selected":""}>${c}</option>`).join("")}</select></div>
    <div><label>Valor unitário (R$)</label><input name="value" inputmode="decimal" value="${base.value?String(base.value).replace(".",","):""}" placeholder="0,00"></div></div>
    <div class="row"><div><label>Categoria</label><input name="category" list="cats" value="${esc(base.category)}" placeholder="Ex.: Ferramentas"></div>
    <div><label>Qtd. mínima</label><input name="minQty" inputmode="decimal" value="${base.minQty?fq(base.minQty):""}" placeholder="alerta"></div></div>
    <datalist id="cats">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <label>Observação</label><textarea name="notes" placeholder="Marca, modelo, cor, detalhes…">${esc(base.notes)}</textarea>`, d => {
    if(!d.name.trim()) return false;
    ui.lastSt = d.storageId;
    const vals = {name:d.name.trim(), qty:Math.max(0,num(d.qty)), unit:d.unit.trim()||"un", storageId:d.storageId, condition:d.condition, category:d.category.trim(), minQty:num(d.minQty), value:Math.round(num(d.value)*100)/100, notes:d.notes.trim(), updatedAt:Date.now()};
    if(id){
      const it = I(id), oldQty = it.qty, oldSt = it.storageId;
      if(oldSt!==vals.storageId) logMove("transferencia", it, it.qty, {from:path(oldSt), to:path(vals.storageId), note:"edição"});
      Object.assign(it, vals);
      if(oldQty!==vals.qty) logMove("ajuste", it, vals.qty-oldQty, {where:path(it.storageId), note:`${fq(oldQty)} → ${fq(vals.qty)}`});
      toast("Item salvo");
    } else {
      const it = Object.assign({id:uid(), createdAt:Date.now()}, vals);

function doPrint(title, sub, items, op){

/* importação de produtos com mapeamento de armazém */
const pick = (o, ...keys) => { for(const k of keys){ if(o[k]!==undefined && o[k]!==null && o[k]!=="") return o[k]; } return undefined; };
const splitPath = s => String(s).split(/\s*(?:›|>|\/|\\)\s*/).map(x=>x.trim()).filter(Boolean);
function resolveStorage(label, id){
  if(id && S(id)) return S(id);
  if(!label) return null;
  const parts = splitPath(label), full = norm(parts.join(" > "));
  let hit = db.storages.find(s => norm(splitPath(path(s.id)).join(" > ")) === full);
  if(hit) return hit;
  const last = norm(parts[parts.length-1]);
  const byName = db.storages.filter(s => norm(s.name) === last);
  if(byName.length===1) return byName[0];
  if(byName.length>1 && parts.length>1){ const par = norm(parts[parts.length-2]); hit = byName.find(s => S(s.parentId) && norm(S(s.parentId).name)===par); if(hit) return hit; }
  return null;
}
function guessType(name){
  const n = norm(name);
  for(const t of Object.keys(TYPES)) if(n.startsWith(norm(t))) return t;
  if(/^(quarto|sala|cozinha|garagem|banheiro|lavanderia|escritorio|varanda|deposito|sotao|porao|area)/.test(n)) return "Cômodo";
  if(/^(estante)/.test(n)) return "Prateleira";
  if(/^(carro|moto|caminhonete)/.test(n)) return "Veículo";
  return "Outro";
}
function createPath(label, baseParent=""){
  let parent = baseParent;
  for(const name of splitPath(label)){
    let s = db.storages.find(x => (x.parentId||"")===parent && norm(x.name)===norm(name));
    if(!s){ s = {id:uid(), name, type:guessType(name), parentId:parent, location:"", notes:"", createdAt:Date.now()}; db.storages.push(s); }
    parent = s.id;
  }
  return parent;
}
function importProducts(raw){
  const rows = [], skipped = [];
  raw.forEach((o, idx) => {
    if(!o || typeof o!=="object"){ skipped.push(idx+1); return; }
    const name = String(pick(o,"name","nome","produto","item","descricao") ?? "").trim();
    if(!name){ skipped.push(idx+1); return; }
    const cond = String(pick(o,"condition","estado","condicao") ?? "").trim();
    const condOk = CONDS.find(c => norm(c)===norm(cond)) || (cond ? cond : "");
    const label = String(pick(o,"storage","armazem","armazém","local","localizacao","storagePath") ?? "").trim();
    const st = resolveStorage(label, pick(o,"storageId"));
    rows.push({name, qty:Math.max(0, num(pick(o,"qty","quantidade","qtd","quantity") ?? 1)), unit:String(pick(o,"unit","unidade","un") ?? "un").trim()||"un",
      value:Math.round(num(pick(o,"value","valor","preco","preço","price") ?? 0)*100)/100, condition:condOk,
      category:String(pick(o,"category","categoria") ?? "").trim(), notes:String(pick(o,"notes","observacao","observação","obs","nota") ?? "").trim(),
      minQty:num(pick(o,"minQty","minimo","mínimo","qtdMinima") ?? 0), label, storageId: st ? st.id : ""});
  });
  if(!rows.length){ alert("Nenhum produto válido encontrado (o campo \"name\" é obrigatório)."); return; }
  const unresolved = {};
  rows.filter(r=>!r.storageId).forEach(r => { (unresolved[r.label] = unresolved[r.label] || []).push(r); });
  const groups = Object.keys(unresolved).sort((a,b)=> (a==="")-(b==="") || a.localeCompare(b,"pt-BR"));
  const defSt = S(ui.lastSt) ? ui.lastSt : (cur().v==="storage" ? cur().id : "");
  const okN = rows.length - groups.reduce((a,g)=>a+unresolved[g].length,0);
  const opts = (g) => {
    const create = g ? `<option value="new:root" selected>➕ Criar “${esc(splitPath(g).join(" › "))}”</option>` : (!db.storages.length ? `<option value="new:Importados" selected>➕ Criar “Importados”</option>` : "");
    const createIn = g && db.storages.length ? `<optgroup label="Criar “${esc(splitPath(g).pop())}” dentro de…">${db.storages.map(s=>({id:s.id,p:path(s.id)})).sort((a,b)=>a.p.localeCompare(b.p,"pt-BR")).map(o=>`<option value="newin:${o.id}">${esc(o.p)} › ${esc(splitPath(g).pop())}</option>`).join("")}</optgroup>` : "";
    const existing = db.storages.length ? `<optgroup label="Usar armazém existente">${storageOptions(g?"":defSt)}</optgroup>` : "";
    return `${!g && db.storages.length && !defSt ? `<option value="" disabled selected>Escolha o armazém…</option>`:""}${create}${existing}${createIn}`;
  };
  openSheet("Importar produtos", `
    <div class="card pad" style="margin-top:8px;display:flex;gap:12px;align-items:center"><div class="tile t3">${icon("json")}</div>
      <div><b>${rows.length} produto${rows.length>1?"s":""}</b> encontrado${rows.length>1?"s":""}<div class="hint" style="margin:0">${okN} com armazém identificado${skipped.length?` · ${skipped.length} ignorado(s) sem nome`:""}</div></div></div>
    ${groups.length?`<label>Onde guardar os itens sem armazém identificado?</label>
      ${groups.map((g,x)=>`<div class="map"><div class="t">${g?`“${esc(g)}”`:"Sem armazém informado"} <span class="badge">${unresolved[g].length} ite${unresolved[g].length>1?"ns":"m"}</span></div>
        <div class="hint" style="margin:2px 0 0">${unresolved[g].slice(0,3).map(r=>esc(r.name)).join(", ")}${unresolved[g].length>3?"…":""}</div>
        <select name="g${x}" required>${opts(g)}</select></div>`).join("")}`:`<p class="hint">Todos os armazéns foram identificados.</p>`}
    <div class="checks"><label><input type="checkbox" name="merge" checked> Somar à quantidade se o item já existir no armazém (mesmo nome, unidade e estado)</label></div>
    <label>Prévia</label>
    <ul class="prev">${rows.slice(0,6).map(r=>`<li>${esc(r.name)} — ${fq(r.qty)} ${esc(r.unit)}${r.value?" · "+money(r.value):""}${r.storageId?` → <i>${esc(path(r.storageId))}</i>`:""}</li>`).join("")}${rows.length>6?`<li>… e mais ${rows.length-6}</li>`:""}</ul>`, f => {
    const target = {};
    for(let x=0; x<groups.length; x++){
      const g = groups[x], v = f["g"+x];
      if(!v){ toast("Escolha o armazém de todos os grupos"); return false; }
      if(v==="new:root") target[g] = createPath(g);
      else if(v.startsWith("new:")) target[g] = createPath(v.slice(4));
      else if(v.startsWith("newin:")) target[g] = createPath(splitPath(g).pop(), v.slice(6));
      else target[g] = v;
    }
    let created = 0, merged = 0;
    rows.forEach(r => {
      const storageId = r.storageId || target[r.label];
      const vals = {name:r.name, qty:r.qty, unit:r.unit, value:r.value, condition:r.condition, category:r.category, notes:r.notes, minQty:r.minQty, storageId};
      const twin = f.merge ? findTwin(Object.assign({id:"_"}, vals), storageId) : null;
      if(twin){
        twin.qty = num(twin.qty + r.qty); twin.updatedAt = Date.now();
        if(r.value) twin.value = r.value; if(r.category && !twin.category) twin.category = r.category; if(r.notes && !twin.notes) twin.notes = r.notes; if(r.minQty) twin.minQty = r.minQty;
        logMove("importacao", twin, r.qty, {where:path(storageId), note:"importação (somado)"}); merged++;
      } else {
        const it = Object.assign({id:uid(), createdAt:Date.now(), updatedAt:Date.now()}, vals);
        db.items.push(it); logMove("importacao", it, it.qty, {where:path(storageId), note:"importação"}); created++;
      }
    });
    save(); toast(`Importado: ${created} novo(s)${merged?`, ${merged} somado(s)`:""} ✔`);
  }, "Importar");
}

function readS3Form(){
  const f = $("#s3f"); if(!f) return;
  const d = Object.fromEntries(new FormData(f));
  let prefix = (d.prefix||"").trim(); if(prefix && !prefix.endsWith("/")) prefix += "/";
  cfg.s3 = {bucket:d.bucket.trim(), region:d.region.trim()||"us-east-1", prefix, endpoint:d.endpoint.trim(), accessKey:d.accessKey.trim(), secretKey:d.secretKey.trim(), auto:!!d.auto};
  saveCfg();
}
function s3req(extra){ return nativeCall("s3", JSON.stringify(Object.assign({}, cfg.s3, extra))); }
let s3busy = false;
async function s3Backup(silent){
  if(!silent) readS3Form();
  if(!N){ if(!silent) toast("Disponível apenas no app Android"); return; }
  const s3 = cfg.s3;
  if(!s3.bucket || !s3.accessKey || !s3.secretKey){ if(!silent) toast("Configure bucket e chaves"); return; }
  if(s3busy) return; s3busy = true;
  if(!silent) toast("Enviando…");
  try{
    const body = backupJSON();
    await s3req({method:"PUT", key:`${s3.prefix}inventario-${stamp()}.json`, body});
    await s3req({method:"PUT", key:`${s3.prefix}inventario-latest.json`, body});
    cfg.lastBackup = Date.now(); cfg.dirty = false; saveCfg();
    if(!silent){ toast("Backup enviado ✔"); if(tab==="more" && !stack.length) vMore(); }
  }catch(e){ if(!silent) alert("Falha no backup S3:\n"+e.message); }
  finally{ s3busy = false; }
}
async function s3Restore(){
  readS3Form();
  if(!N){ toast("Disponível apenas no app Android"); return; }
  const s3 = cfg.s3;
  if(!s3.bucket || !s3.accessKey || !s3.secretKey){ toast("Configure bucket e chaves"); return; }
  try{
    toast("Listando backups…");
    const xml = await s3req({method:"GET", key:"", query:{"list-type":"2", prefix:s3.prefix}});
    const doc = new DOMParser().parseFromString(xml, "application/xml");
    const files = [...doc.getElementsByTagName("Contents")].map(c=>({key:c.getElementsByTagName("Key")[0]?.textContent, size:+c.getElementsByTagName("Size")[0]?.textContent}))
      .filter(f=>f.key && f.key.endsWith(".json")).sort((a,b)=>b.key.localeCompare(a.key));
    if(!files.length){ toast("Nenhum backup encontrado"); return; }
    openSheet("Restaurar do S3", `<label>Escolha o backup</label><select name="key">${files.map(f=>`<option value="${esc(f.key)}">${esc(f.key.slice(s3.prefix.length))} · ${(f.size/1024).toFixed(1)} KB</option>`).join("")}</select>
      <p class="hint">Você poderá escolher entre substituir tudo ou só adicionar os itens.</p>`, d => {
      toast("Baixando…");
      s3req({method:"GET", key:d.key}).then(t=>setTimeout(()=>handleImport(t), 50)).catch(e=>alert("Erro: "+e.message));
    }, "Continuar");
  }catch(e){ alert("Falha ao acessar S3:\n"+e.message); }
}
window.onAppPause = () => { if(cfg.s3.auto && cfg.dirty) s3Backup(true); };
function wipeAll(){
  if(!confirm("Apagar TODOS os dados do inventário? Isso não pode ser desfeito (faça um backup antes).")) return;
  if(prompt('Digite APAGAR para confirmar')!=="APAGAR") return;
  rawWrite("db-before-wipe.json", JSON.stringify(db));
  db = emptyDB(); save(); stack=[]; setTab("home"); toast("Dados apagados");
}

render();
</script>
